name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 로직 테스트
        run: node --test test/logic.test.js

      - name: 의존성 설치
        run: npm install

      - name: 안드로이드 프로젝트 만들기
        run: npx cap add android

      - name: 로컬 AI(http://127.0.0.1)를 부를 수 있게 허용
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          grep -n "usesCleartextTraffic" android/app/src/main/AndroidManifest.xml

      - name: 웹 파일 동기화
        run: npx cap sync android

      - name: APK 빌드
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: ai-group-chat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
